# Separate Worker: Pages Functions can't hold cron triggers.
# Deploy from THIS directory: `wrangler deploy`
# Secrets: RESEND_API_KEY (free tier, `wrangler secret put RESEND_API_KEY`);
#   PROBE_TARGET (seed inbox for the weekly deliverability probe);
#   CRON_KEY optional (`wrangler secret put CRON_KEY`) for manual triggers
#   (?key=...&run=probe runs the probe on demand).
# Vars: APP_URL=https://periodtracker.run
# Prereq: D1 id below (same database as the app).
# Optional paid path: onboard mail.periodtracker.run to Cloudflare Email
# Sending and uncomment the [[send_email]] block below.
name = "periodtracker-email"
main = "email-cron.js"
compatibility_date = "2024-11-01"

[vars]
APP_URL = "https://periodtracker.run"

[triggers]
crons = ["0 7 * * 1", "0 7 1 * *", "30 6 * * 1", "7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "periodtracker"
database_id = "b9344d01-3125-4790-a6f7-9ae0d08fe254"

# [[send_email]]
# binding = "EMAIL"
