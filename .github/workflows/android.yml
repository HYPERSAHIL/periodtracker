name: Android APK (cloud build, no local SDK needed)

# Builds a debug APK on GitHub's Ubuntu runners: JDK + Android cmdline-tools
# download ON THE RUNNER, never locally. Includes the staged widget +
# health-bridge sources (copied in after `cap add android`).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'api/**', 'android-widget/**', 'health-bridge/**', 'capacitor.config.ts', 'package.json']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      # drop in staged native sources (widget + health bridge)
      - run: |
          cp android-widget/CycleWidget.java android-widget/WidgetSnapshotPlugin.java \
             android/app/src/main/java/run/periodtracker/app/ || echo "widget copy skipped (adjust package path)"
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml
          cp android-widget/widget_cycle.xml android/app/src/main/res/layout/
          cp android-widget/cycle_widget_info.xml android/app/src/main/res/xml/
          cp health-bridge/HealthBridgePlugin.java android/app/src/main/java/run/periodtracker/app/ || true
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: periodtracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Release: tag push (v3.1.0) -> signed APK attached as periodtracker.apk,
  # which is exactly what the in-app self-updater looks for. Installed apps
  # then update with one tap — nobody re-downloads anything manually.
  # One-time setup: create ONE release keystore and store as repo secrets:
  #   keytool -genkeypair -keystore release.keystore -alias periodtracker \
  #     -keyalg RSA -keysize 2048 -validity 10950
  #   base64 -w0 release.keystore  # -> KEYSTORE_BASE64
  # Secrets needed: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD.
  # Without them the job still uploads an UNSIGNED release APK (testing only —
  # Android refuses it as an update over a differently-signed install).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: |
          cp android-widget/CycleWidget.java android-widget/WidgetSnapshotPlugin.java \
             android/app/src/main/java/run/periodtracker/app/ || echo "widget copy skipped (adjust package path)"
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/xml
          cp android-widget/widget_cycle.xml android/app/src/main/res/layout/
          cp android-widget/cycle_widget_info.xml android/app/src/main/res/xml/
          cp health-bridge/HealthBridgePlugin.java android/app/src/main/java/run/periodtracker/app/ || true
      - run: npx cap sync android
      - name: Decode keystore (if secrets present)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build release APK
        working-directory: android
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "::warning::No keystore secrets — building UNSIGNED release APK (won't install over signed builds)"
            ./gradlew assembleRelease --no-daemon
          fi
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Attach to GitHub Release as periodtracker.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ./periodtracker.apk
          gh release create "${{ github.ref_name }}" ./periodtracker.apk \
            --title "${{ github.ref_name }}" \
            --notes "See the in-app changelog. Installed apps pick this up automatically via the self-updater."
