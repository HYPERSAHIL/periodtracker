name: Deploy to Cloudflare Pages

# Manual deploy from the Actions tab. To enable push-deploys, create a repository
# variable CF_DEPLOY=true plus CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CF_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # NOTE: package-lock.json predates the eslint devDeps (installed via bun
      # locally, see bun.lock). Run `npm install` once to regenerate it, then
      # re-add `- run: npm run lint` here.
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name periodtracker
